name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12", "3.14"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Check Python and dashboard behaviour
        run: make check
      - name: Check the diff
        run: git diff --check HEAD^ HEAD

  browser:
    name: Browser / desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Check English and Japanese dashboards in Chrome
        run: python scripts/check_browser.py --out "$RUNNER_TEMP/browser-check"
      - name: Save rendered pages and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-check
          path: ${{ runner.temp }}/browser-check
          if-no-files-found: error
          retention-days: 7

  pdf:
    name: PDF / ${{ matrix.engine }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chrome, weasyprint]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install PDF inspection and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-noto-cjk
      - name: Install WeasyPrint CLI
        if: matrix.engine == 'weasyprint'
        run: python -m pip install weasyprint
      - name: Print and inspect English and Japanese PDFs
        run: |
          python scripts/check_pdf.py --engine "${{ matrix.engine }}" --out "$RUNNER_TEMP/pdf-check"
          for lang in en ja; do
            pdftoppm -scale-to 1000 -png "$RUNNER_TEMP/pdf-check/$lang.pdf" "$RUNNER_TEMP/pdf-check/$lang"
          done
      - name: Save PDFs, extracted text and rendered pages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-check-${{ matrix.engine }}
          path: ${{ runner.temp }}/pdf-check
          if-no-files-found: error
          retention-days: 7
